<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Stackly</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS (global theme) -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        body {
            background-color: #0f172a; /* Dark Navy Base */
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 1rem;
        }

        /* Abstract Background Animations */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .shape-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(240, 90, 40, 0.15) 0%, transparent 70%);
            animation: float 10s ease-in-out infinite;
        }

        .shape-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(255, 184, 0, 0.1) 0%, transparent 70%);
            animation: float 14s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.05); }
        }

        /* 404 Text Styling */
        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #f05a28, #ffb800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 20px 40px rgba(240, 90, 40, 0.2);
        }

        /* Glassmorphic Card */
        .error-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            padding: 4rem 3rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .error-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f05a28, #ffb800);
        }

        /* Buttons */
        .btn-hover-scale {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-scale:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(240, 90, 40, 0.3);
        }

        .btn-outline-glass {
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }
        .btn-outline-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Mobile specific overrides */
        @media (max-width: 575.98px) {
            .error-card {
                padding: 3rem 1.5rem;
                border-radius: 1.5rem;
            }
            .btn-group-mobile {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }
            .btn-group-mobile .btn {
                width: 100%;
                margin: 0 !important;
            }
            .error-subtitle {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Background Shapes -->
    <div class="bg-shapes">
        <div class="shape-1"></div>
        <div class="shape-2"></div>
    </div>

    <!-- Main Content -->
    <div class="error-container">
        <div class="error-card">
            <!-- Logo -->
            <a href="index.html" class="d-inline-block mb-4">
                <img src="assets/images/logoStackly.webp" alt="Stackly Logo" height="45" style="filter: brightness(0) invert(1);">
            </a>
            
            <!-- 404 Text -->
            <h1 class="error-code">404</h1>
            <h2 class="error-subtitle text-white fw-bold mb-3">Oops! Page Not Found</h2>
            <p class="text-white-50 fs-5 mb-5 mx-auto" style="line-height: 1.7; max-width: 400px;">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            
            <!-- Responsive Buttons -->
            <div class="btn-group-mobile d-flex justify-content-center gap-3">
                <button onclick="window.history.back()" class="btn btn-outline-glass rounded-pill px-4 py-3 fw-bold btn-hover-scale d-inline-flex align-items-center justify-content-center gap-2">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
                <a href="index.html" class="btn btn-primary rounded-pill px-4 py-3 fw-bold btn-hover-scale d-inline-flex align-items-center justify-content-center gap-2">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
